<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMemory Capture</title>
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 class="brand"><img class="brand-logo" src="icons/logo.svg" alt="" width="28" height="28"><span class="brand-name">SmartMemory <span>Capture</span></span></h1>
      <p class="subtitle">Save this page to your collection</p>
    </header>

    <div class="page-info">
      <div class="page-title" id="pageTitle">Loading...</div>
      <div class="page-url" id="pageUrl"></div>
    </div>

    <div class="capture-options">
      <h3>Capture Mode</h3>
      <div class="option-group">
        <label class="option-card">
          <input type="radio" name="captureMode" value="full" checked>
          <div class="option-content">
            <span class="option-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
            <div>
              <div class="option-title">Full Page</div>
              <div class="option-desc">Capture entire page content</div>
            </div>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="captureMode" value="article">
          <div class="option-content">
            <span class="option-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/></svg></span>
            <div>
              <div class="option-title">Article</div>
              <div class="option-desc">Extract main article content</div>
            </div>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="captureMode" value="selection">
          <div class="option-content">
            <span class="option-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg></span>
            <div>
              <div class="option-title">Selection</div>
              <div class="option-desc">Capture selected text only</div>
            </div>
          </div>
        </label>

        <label class="option-card">
          <input type="radio" name="captureMode" value="screenshot">
          <div class="option-content">
            <span class="option-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
            <div>
              <div class="option-title">Screenshot</div>
              <div class="option-desc">Capture visual screenshot</div>
            </div>
          </div>
        </label>
      </div>
    </div>

    <div class="tags-section">
      <label for="tags">Tags (comma-separated)</label>
      <input type="text" id="tags" placeholder="e.g., research, tutorial, important">
    </div>

    <div class="notes-section">
      <label for="notes">Notes (optional)</label>
      <textarea id="notes" placeholder="Add your thoughts or comments..."></textarea>
    </div>

    <div id="duplicateNotice" class="duplicate-notice" style="display:none"></div>

    <div class="actions">
      <button id="captureBtn" class="btn-primary">
        <span class="btn-icon"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></span>
        Capture & Save
      </button>
      <button id="viewLibraryBtn" class="btn-secondary">
        View Library
      </button>
    </div>

    <div class="status" id="status"></div>

    <footer>
      <a href="#" id="settingsLink"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg> Settings</a>
    </footer>
  </div>

  <script src="vendor/readability.js"></script>
  <script src="popup.js"></script>
</body>
</html>
