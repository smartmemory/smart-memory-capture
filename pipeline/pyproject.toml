[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmemory-capture-pipeline"
version = "0.1.0"
description = "SmartMemory Capture Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "httpx==0.25.1",
    "beautifulsoup4==4.12.2",
    "pydantic==2.5.0"
]

[project.optional-dependencies]
ml = [
    # "sentence-transformers==2.2.2",
    # "spacy==3.7.2",
    # "transformers==4.35.0",
    # "torch==2.1.0",
    # "langdetect==1.0.9",
    # "textblob==0.17.1"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
